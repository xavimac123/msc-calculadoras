function calcEsc(s,I){
 var prima=(I.modo==='pct'?I.cua*I.pct/100:I.fijo)*s;
 var descPct=(I.pago==='total'?10:0)+I.ofe;
 var desc=I.op*Math.min(descPct,100)/100;
 var base=I.op-desc+prima;
 var iva=base*I.iva/100;
 var total=base+iva+I.gas;
 var rir=I.age?base*I.rir/100:0, riva=I.age?iva*I.riva/100:0;
 var recibe=total-rir-riva;
 var ir=base*I.ir/100;
 return {prima:prima,descPct:descPct,desc:desc,base:base,iva:iva,total:total,rir:rir,riva:riva,recibe:recibe,ivaSri:iva-riva,ir:ir,neta:base-I.cos-ir};
}
