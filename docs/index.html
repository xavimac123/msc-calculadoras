<html lang="es"><head><meta charset="utf-8"><script>window.MSC_PWA=true</script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14181E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MSC Legal"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSC · Calculadoras legales</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"><style id="css">
:root{--card:#fff;--oro:#A09046;--oroc:#C9BC82;--olivo:#6E6230;--carbon:#14181E;--marfil:#F7F5EE;--linea:#E3DFD0;--gris:#5B6068;--ok:#2F6B3A;--okf:#E5F0E4;--mal:#9B2C22;--malf:#F7E4E1;--avi:#8A5A00;--avif:#FBF0D9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--marfil);color:var(--carbon);font-family:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--carbon);color:#fff;padding:14px 16px 0}
.marca{display:flex;align-items:center;gap:10px}
.iso{width:34px;height:34px;flex:none;object-fit:contain}
.wm{font-stretch:118%;font-weight:700;letter-spacing:.06em;font-size:12.5px;line-height:1.15;color:var(--oro)}
.wm small{display:block;color:var(--oroc);font-weight:500;letter-spacing:.14em;font-size:9.5px;margin-top:2px}
nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:0;background:none;border:0;color:#C9C6BA;font:inherit;font-weight:600;font-size:13px;letter-spacing:-.01em;padding:10px 9px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--oro)}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h2{font-stretch:115%;font-size:18px;margin:6px 0 4px;letter-spacing:.01em}
.sub{color:var(--gris);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--linea);border-radius:10px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:14px;font-stretch:112%;letter-spacing:.02em;color:var(--olivo);text-transform:uppercase}
label{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin:0 0 4px}
input,select{width:100%;font:inherit;font-size:15px;padding:10px 11px;border:1px solid #CFCABA;border-radius:8px;background:#fff;color:var(--carbon);min-height:44px}
input:focus,select:focus{outline:2px solid var(--oro);outline-offset:0;border-color:var(--oro)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.full{grid-column:1/-1}
@media(max-width:430px){.grid3{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--carbon);margin:4px 0;min-height:36px}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--olivo)}
.hint{font-size:12px;color:var(--gris);margin:4px 0 0}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--avif);color:var(--avi);vertical-align:middle}
.tag.v{background:var(--okf);color:var(--ok)}
.seg{display:flex;border:1px solid #CFCABA;border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;font:inherit;font-size:13.5px;font-weight:600;padding:10px 6px;color:var(--gris);cursor:pointer;min-height:44px}
.seg button+button{border-left:1px solid #CFCABA}
.seg button[aria-pressed=true]{background:var(--carbon);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
tr.tot td{font-weight:700;border-top:2px solid var(--carbon)}
tr.hi td{background:#FBF9F1}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.big{font-size:30px;font-weight:800;font-stretch:110%;letter-spacing:-.01em;margin:2px 0}
.res{border-radius:10px;padding:14px;margin:0 0 12px;border:1px solid var(--linea);background:#fff}
.res.ok{background:var(--okf);border-color:#BBD7B8}
.res.mal{background:var(--malf);border-color:#E7BDB6}
.res .estado{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.res.ok .estado{color:var(--ok)}.res.mal .estado{color:var(--mal)}
.accion{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:8px;font-weight:800;font-stretch:110%;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.res.ok .accion{background:var(--ok);color:#fff}.res.mal .accion{background:var(--mal);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--carbon);background:var(--carbon);color:#fff;cursor:pointer;min-height:44px}
.btn.sec{background:#fff;color:var(--carbon)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px}
.kpi .l{font-size:11px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .n{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.sel{border-color:var(--oro);box-shadow:inset 0 0 0 1px var(--oro)}
.nota{font-size:12px;color:var(--gris);border-left:3px solid var(--oroc);padding:6px 10px;background:#FBF9F1;border-radius:0 6px 6px 0;margin:8px 0 0}
details{margin-top:8px}summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--olivo);padding:6px 0}
.tabla-ed input{min-height:34px;padding:5px 6px;font-size:13px;text-align:right}
.msg{font-size:13px;margin-top:8px}
.msg.e{color:var(--mal)}.msg.o{color:var(--ok)}
footer{max-width:760px;margin:0 auto;padding:0 14px 28px;font-size:11.5px;color:var(--gris)}
[hidden]{display:none!important}
body.dark{--marfil:#0F1216;--linea:#2A3038;--gris:#9AA1AA;--card:#171B21;--okf:#14261A;--malf:#2B1714;--avif:#2A2212;--olivo:#C9BC82;background:#0F1216;color:#E7E4DA}
body.dark .res,body.dark .kpi,body.dark input,body.dark select,body.dark textarea,body.dark .seg button,body.dark .btn.sec{background:#171B21;color:#E7E4DA;border-color:#323A45}
body.dark input:disabled{background:#12161B;color:#9AA1AA}
body.dark .seg{border-color:#323A45}body.dark .seg button+button{border-left-color:#323A45}
body.dark .seg button[aria-pressed=true],body.dark .btn:not(.sec){background:var(--oro);border-color:var(--oro);color:#14181E}
body.dark .res.ok{background:#14261A;border-color:#2C4A33}body.dark .res.mal{background:#2B1714;border-color:#5A2B26}
body.dark .res.ok .estado{color:#8FCB98}body.dark .res.mal .estado{color:#F08A7E}
body.dark .nota{background:#1A1E24}body.dark tr.hi td{background:#1C2128}body.dark tr.tot td{border-top-color:#E7E4DA}
body.dark label{color:#A9AFB7}body.dark .card h3{color:#C9BC82}body.dark footer{color:#7E858E}
body.dark a{color:#C9BC82}body.dark .tag.v{background:#1E3324;color:#9AD3A4}body.dark .tag{background:#2E2715;color:#E2C26B}
body.dark [style*="background:#FBF9F1"],body.dark [style*="background:#F7F5EE"]{background:#1C2128!important}

body.locked nav,body.locked #hdr-lock{display:none!important}body.locked main>section:not(#v-cli){display:none!important}
#hdr-lock{position:absolute;right:12px;top:14px;background:none;border:1px solid #3A3F47;color:#C9C6BA;border-radius:8px;font:inherit;font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer}
header{position:relative}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--carbon);color:#fff;padding:10px 14px;border-radius:10px;font-size:13.5px;max-width:92%;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.2)}#toast.e{background:var(--mal)}

function calcEsc(s,I){
 var prima=(I.modo==='pct'?I.cua*I.pct/100:I.fijo)*s;

 var desc=I.op*Math.min(descPct,100)/100;
 var base=I.op-desc+prima;
 var iva=base*I.iva/100;
 var total=base+iva+I.gas;
 var rir=I.age?base*I.rir/100:0, riva=I.age?iva*I.riva/100:0;
 var recibe=total-rir-riva;
 var ir=base*I.ir/100;
 return {prima:prima,descPct:descPct,desc:desc,base:base,iva:iva,total:total,rir:rir,riva:riva,recibe:recibe,ivaSri:iva-riva,ir:ir,neta:base-I.cos-ir};
}

 ];

  obj(im,['<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n',j,'\nendstream']);
  obj(ct,['<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'])});

var TIPO={t:'término (días hábiles)',p:'plazo (días calendario)',m:'plazo en meses',a:'plazo en años'};
function feriadosSet(){var s={};Object.keys(DATA.feriados).forEach(function(y){DATA.feriados[y].forEach(function(f){s[f[0]]=f[1]})});(DATA.inhabilesExtra||[]).concat(store('extra')||[]).forEach(function(f){s[f[0]]=f[1]});return s}
function inhabil(d,F){var w=d.getDay();if(w===0)return 'domingo';if(w===6)return 'sábado';return F[iso(d)]||''}
function aniosCub(){return Object.keys(DATA.feriados)}
function computar(desde,n,tipo,F){
 var d=new Date(desde.getTime()),saltos=[];
 if(tipo==='t'){var c=0;while(c<n){d.setDate(d.getDate()+1);var r=inhabil(d,F);if(r){if(F[iso(d)])saltos.push([new Date(d),r])}else c++}}
 else{if(tipo==='p')d.setDate(d.getDate()+n);else{var dia=d.getDate();d.setDate(1);if(tipo==='m')d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);d.setDate(Math.min(dia,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  var mov=false;while(inhabil(d,F)){if(F[iso(d)])saltos.push([new Date(d),F[iso(d)]]);d.setDate(d.getDate()+1);mov=true}if(mov)saltos.push(['mov'])}
 return {fin:d,saltos:saltos};
}

 '<div class="card"><h3>Cálculo</h3><div class="grid">'+

 '</div><p class="hint" id="l-base"></p></div>'+
 '<div class="res" id="l-res"></div>'+
 '<div class="card"><h3>Días inhábiles adicionales</h3><p class="hint" style="margin-top:0">Ya están cargados los feriados nacionales '+aniosCub().join(' y ')+'. Agregue feriados locales (p. ej. Fundación de Guayaquil), suspensiones de labores o días declarados inhábiles por el Consejo de la Judicatura.</p>'+
  '<div class="grid" style="margin-top:8px"><div><label for="l-xd">Fecha</label><input id="l-xd" type="date"></div><div><label for="l-xn">Motivo</label><input id="l-xn" placeholder="Ej.: Fundación de Guayaquil"></div></div>'+
  '<div class="row" style="margin-top:8px"><button class="btn sec" id="l-xadd" type="button">Agregar en este dispositivo</button><button class="btn sec" id="l-xsave" type="button" data-needs="art">Guardar en la app</button></div><div class="msg" id="l-xmsg"></div><div id="l-xlist"></div>'+
  '<details><summary>Ver feriados nacionales cargados</summary><div class="scroll"><table><tbody>'+aniosCub().map(function(y){return DATA.feriados[y].map(function(f){return '<tr><td>'+largo(parseD(f[0]))+'</td><td style="text-align:left">'+esc(f[1])+'</td></tr>'}).join('')}).join('')+'</tbody></table></div><p class="hint">Fuente: calendario oficial de feriados 2026–2030 del Viceministerio de Turismo, con traslados aplicados. 2 de enero de 2026: descanso por Decreto Ejecutivo 249.</p></details></div>'+
 '<p class="nota">Las actuaciones marcadas "verificar" vienen de la norma pero no se contrastaron con el texto vigente en esta versión. Confirme el artículo antes de usar el resultado. Para materias especiales (niñez, laboral, constitucional) revise si la ley fija reglas propias.</p>';
 var st=store('pla')||{};

 $('#l-pre').value=st.pre||'0-0';

 if($('#l-pre').value!=='custom'){var p0=pre();$('#l-n').value=p0[1];L.tipo=p0[2]}
 $$('#l-tipo button').forEach(function(b){b.onclick=function(){L.tipo=b.dataset.k;calcPla()}});

 $('#l-xadd').onclick=function(){var d=$('#l-xd').value,n=$('#l-xn').value.trim()||'Día inhábil';if(!d)return;var x=store('extra')||[];x.push([d,n]);store('extra',x);listExtra();calcPla()};
 $('#l-xsave').onclick=function(){var x=store('extra')||[];DATA.inhabilesExtra=(DATA.inhabilesExtra||[]).concat(x);store('extra',[]);guardar($('#l-xmsg'),'Días inhábiles guardados en la app.')};

function calcPla(){
 var p=pre(),custom=!p;
 $('#l-wt').hidden=!custom;
 $$('#l-tipo button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===L.tipo)});
 var n=Math.max(1,Math.round(num($('#l-n').value))),fs=$('#l-fec').value,tipo=custom?L.tipo:p[2];
 $('#l-n').disabled=!custom;
 $('#l-base').innerHTML=p?'Base: '+(p[0].indexOf('tránsito')>-1||p[3]==='Art. 644'?'COIP':(PRE[+$('#l-pre').value.split('-')[0]].g.split(' ')[0]))+' '+p[3]+' · '+TIPO[p[2]]+' '+(p[4]?'<span class="tag v">verificado</span>':'<span class="tag">verificar</span>'):'Cómputo personalizado: '+TIPO[tipo]+'.';

 var hoy=new Date();hoy.setHours(0,0,0,0);
 var rest=0,d=new Date(hoy);if(r.fin>=hoy){while(d<r.fin){d.setDate(d.getDate()+1);if(tipo!=='t'||!inhabil(d,F))rest++}}
 var venc=r.fin<hoy;
 var ini=inhabil(desde,F);
 $('#l-res').className='res '+(venc?'mal':'ok');
 $('#l-res').innerHTML='<div class="estado">'+(venc?'Vencido':'Vence')+'</div><div class="big" style="font-size:22px">'+largo(r.fin)+'</div>'+
  '<div>'+n+' '+({t:'días hábiles',p:'días calendario',m:n===1?'mes':'meses',a:n===1?'año':'años'}[tipo])+' desde la notificación del '+largo(desde)+'.</div>'+
  (venc?'':'<div style="margin-top:4px"><b>'+(rest===0?'Vence hoy':'Quedan '+rest+' '+(tipo==='t'?'días hábiles':'días'))+'</b> contando desde hoy.</div>')+
  (ini?'<p class="hint">La notificación fue en día inhábil ('+esc(ini)+'): el cómputo empieza igual al día siguiente; confirme el criterio del juzgado.</p>':'')+
  (r.saltos.filter(function(s){return s[0]!=='mov'}).length?'<p class="hint">Feriados excluidos o saltados: '+r.saltos.filter(function(s){return s[0]!=='mov'}).map(function(s){return s[0].getDate()+' '+MESES[s[0].getMonth()].slice(0,3)+' ('+esc(s[1])+')'}).join(', ')+'.</p>':'')+
  (r.saltos.some(function(s){return s[0]==='mov'})?'<p class="hint">El plazo vencía en día inhábil y se trasladó al siguiente día hábil.</p>':'')+
  (cub?'':'<p class="hint" style="color:var(--mal)">El cómputo cae en un año sin feriados cargados: el resultado solo descuenta fines de semana.</p>');
 store('pla',{fec:fs,pre:$('#l-pre').value,tipo:L.tipo,n:n});
}

function renderTra(){
 var v=$('#v-tra');
 v.innerHTML='<h2>Notificación de boleta de tránsito</h2><p class="sub">Art. 179 LOTTTSV: la citación que no se entrega personalmente se remite al domicilio o al correo electrónico registrado del propietario en un plazo no mayor de 72 horas desde la infracción.</p>'+
 '<div class="card"><h3>Fechas</h3><div class="grid">'+
  '<div class="full"><label for="t-inf">Fecha y hora de la infracción</label><input id="t-inf" type="datetime-local"></div>'+
  '<div class="full"><label for="t-not">Fecha y hora en que llegó el correo de notificación</label><input id="t-not" type="datetime-local"></div>'+
 '</div><p class="hint">Use la hora de la boleta y la del correo recibido (guarde captura del correo con su fecha).</p></div>'+
 '<div class="res" id="t-res"></div>'+
 '<p class="nota">La impugnación se presenta dentro del término de 3 días desde la notificación (art. 644 COIP), contados en días hábiles. Aunque la notificación esté en término, puede impugnarse por el fondo (error en la placa, señalización, prueba de la detección electrónica). Para contravenciones detectadas por medios electrónicos rige también el art. 179.b LOTTTSV.</p>';
 var st=store('tra')||{};
 if(st.inf)$('#t-inf').value=st.inf;if(st.not)$('#t-not').value=st.not;
 $('#t-inf').oninput=$('#t-not').oninput=calcTra;calcTra();
}
function calcTra(){
 var a=$('#t-inf').value,b=$('#t-not').value,r=$('#t-res');
 store('tra',{inf:a,not:b});
 if(!a||!b){r.className='res';r.innerHTML='<p style="margin:0">Ingrese ambas fechas para ver el resultado.</p>';return}
 var A=new Date(a),B=new Date(b),h=(B-A)/36e5;
 if(h<0){r.className='res mal';r.innerHTML='<div class="estado">Revise las fechas</div><p style="margin:4px 0 0">La notificación no puede ser anterior a la infracción.</p>';return}
 var ok=h<=72,F=feriadosSet(),lim=computar(new Date(B.getFullYear(),B.getMonth(),B.getDate()),3,'t',F).fin;
 var dd=Math.floor(h/24),hh=Math.floor(h-dd*24),mm=Math.round((h-Math.floor(h))*60);if(mm===60){mm=0;hh++}
 var tope=new Date(A.getTime()+72*36e5);
 r.className='res '+(ok?'ok':'mal');
 r.innerHTML='<div class="estado">'+(ok?'En término':'Extemporáneo')+'</div><div class="big">'+(Math.round(h*10)/10).toLocaleString('es-EC')+' horas</div>'+
  '<div>'+dd+' día'+(dd===1?'':'s')+', '+hh+' h '+mm+' min entre la infracción y la notificación. Límite: '+largoH(tope)+'.</div>'+
  '<div class="accion">'+(ok?'Pagar multa':'Impugnar')+'</div>'+
  '<p style="margin:10px 0 0">'+(ok?'La notificación se hizo dentro de las 72 horas. Salvo que haya argumentos de fondo, corresponde pagar la multa.':'La notificación excedió las 72 horas del art. 179 LOTTTSV: hay base para impugnar por notificación tardía.')+'</p>'+
  '<p style="margin:6px 0 0"><b>Fecha límite para impugnar:</b> '+largo(lim)+' (3 días hábiles desde la notificación).</p>';
}
