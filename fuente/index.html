 }).catch(function(e){msg.className='msg e';msg.textContent='No se pudo generar el archivo: '+(e&&e.message||e)});

function zipStore(files,type){
 var enc=new TextEncoder(),out=[],cen=[],off=0;
 function u16(v){return [v&255,(v>>>8)&255]}function u32(v){return [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}
 files.forEach(function(f){var name=enc.encode(f[0]),data=typeof f[1]==='string'?enc.encode(f[1]):f[1],crc=crc32(data);
  var lh=new Uint8Array([0x50,0x4b,3,4].concat(u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0)));
  out.push(lh,name,data);
  cen.push(new Uint8Array([0x50,0x4b,1,2].concat(u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),name);
  off+=lh.length+name.length+data.length});
 var cs=cen.reduce(function(s,a){return s+a.length},0);
 var end=new Uint8Array([0x50,0x4b,5,6].concat(u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(off),u16(0)));
 return new Blob(out.concat(cen,[end]),{type:type});
}

function calcPen(){
 var T=tabla(),ing=num($('#p-ing').value),iess=$('#p-iess').checked,nh=PH.length,h=Math.min(nh,3),e=PH.some(function(x){return x.e===1})?1:0,gmax=PH.reduce(function(m,x){return x.g!==''&&+x.g>m?+x.g:m},-1);
 var neto=iess?ing*(1-T.descIESS/100):ing, base=Math.max(neto,T.sbu), sb=base/T.sbu;
 var niv=T.niveles.filter(function(n){return sb>n.desde-1e-9&&(n.hasta==null||sb<=n.hasta+1e-9)})[0]||T.niveles[0];
 var col=(h-1)*2+e, p=niv.p[col], pen=r2(base*p/100), dp=gmax>=0&&niv.d?niv.d[gmax]:0, dis=r2(T.sbu*dp/100), tot=r2(pen+dis), cada=r2(pen/nh);
 $$('#p-tb tr').forEach(function(tr){tr.className=+tr.dataset.n===niv.n?'hi':''});
 $('#p-res').innerHTML='<div class="estado" style="color:var(--olivo)">Pensión mínima mensual'+(dis?' (incluye discapacidad)':'')+'</div><div class="big">'+usd(tot)+'</div>'+
  (nh>1?'<div>'+usd(cada)+' por cada hijo ('+nh+' hijos)'+(dis?' + '+usd(dis)+' por discapacidad (por hogar)':'')+'</div>':'')+
  '<table style="margin-top:10px"><tbody>'+
  '<tr><td>Ingreso bruto</td><td>'+usd(ing)+'</td></tr>'+
  (iess?'<tr><td>(−) Aporte IESS '+pct(T.descIESS)+'</td><td>'+usd(-r2(ing*T.descIESS/100))+'</td></tr>':'')+
  (base>neto?'<tr><td>Ingreso menor a 1 SBU: se toma</td><td>'+usd(T.sbu)+'</td></tr>':'')+
  '<tr class="hi"><td>Base de cálculo</td><td>'+usd(r2(base))+'</td></tr>'+
  '<tr><td>Equivale a</td><td>'+sb.toLocaleString('es-EC',{maximumFractionDigits:2})+' SBU</td></tr>'+
  '<tr><td>Hijos</td><td>'+nh+' ('+PH.filter(function(x){return x.e===0}).length+' de 0–2 años, '+PH.filter(function(x){return x.e===1}).length+' de 3+ años)</td></tr>'+
  '<tr><td>Nivel · columna</td><td>Nivel '+niv.n+' · '+COLS[col]+'</td></tr>'+
  '<tr><td>Porcentaje</td><td>'+pct(p)+'</td></tr>'+
  '<tr class="hi"><td>Pensión según tabla</td><td>'+usd(pen)+'</td></tr>'+
  (nh>1?PH.map(function(x,i){return '<tr><td>Hijo '+(i+1)+' ('+(x.e?'3+ años':'0–2 años')+')</td><td>'+usd(i===nh-1?r2(pen-cada*(nh-1)):cada)+'</td></tr>'}).join(''):'')+
  (gmax>=0?'<tr><td>(+) Discapacidad '+GRADOS[gmax+1][1].toLowerCase()+': '+pct(dp)+' de 1 SBU</td><td>'+usd(dis)+'</td></tr>':'')+
  '<tr class="tot"><td>Total mensual</td><td>'+usd(tot)+'</td></tr></tbody></table>';

}

function computar(desde,n,tipo,F){
 var d=new Date(desde.getTime()),saltos=[];
 if(tipo==='t'){var c=0;while(c<n){d.setDate(d.getDate()+1);var r=inhabil(d,F);if(r){if(F[iso(d)])saltos.push([new Date(d),r])}else c++}}
 else{if(tipo==='p')d.setDate(d.getDate()+n);else{var dia=d.getDate();d.setDate(1);if(tipo==='m')d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);d.setDate(Math.min(dia,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  var mov=false;while(inhabil(d,F)){if(F[iso(d)])saltos.push([new Date(d),F[iso(d)]]);d.setDate(d.getDate()+1);mov=true}if(mov)saltos.push(['mov'])}
 return {fin:d,saltos:saltos};
}
function renderPla(){
 var v=$('#v-pla');
 v.innerHTML='<h2>Plazos y términos</h2><p class="sub">Término: solo días hábiles (sin sábados, domingos ni feriados). Plazo: días calendario; si vence en día inhábil, pasa al siguiente hábil. El cómputo empieza el día siguiente a la notificación.</p>'+

  '<div class="full"><label for="l-pre">Actuación</label><select id="l-pre">'+PRE.map(function(g,gi){return '<optgroup label="'+g.g+'">'+g.items.map(function(it,ii){return '<option value="'+gi+'-'+ii+'">'+esc(it[0])+' · '+it[1]+' '+({t:'días término',p:'días plazo',m:it[1]===1?'mes':'meses',a:it[1]===1?'año':'años'}[it[2]])+'</option>'}).join('')+'</optgroup>'}).join('')+'<optgroup label="Otro"><option value="custom">Personalizado…</option></optgroup></select></div>'+
  '<div><label for="l-fec">Fecha de notificación o citación</label><input id="l-fec" type="date"></div>'+

  '<div class="full" id="l-wt"><label>Tipo de cómputo</label><div class="seg" id="l-tipo"><button type="button" data-k="t">Término</button><button type="button" data-k="p">Plazo</button><button type="button" data-k="m">Meses</button></div></div>'+
 '</div><p class="hint" id="l-base"></p></div>'+
 '<div class="res" id="l-res"></div>'+
 '<div class="card"><h3>Días inhábiles adicionales</h3><p class="hint" style="margin-top:0">Ya están cargados los feriados nacionales '+aniosCub().join(' y ')+'. Agregue feriados locales (p. ej. Fundación de Guayaquil), suspensiones de labores o días declarados inhábiles por el Consejo de la Judicatura.</p>'+
  '<div class="grid" style="margin-top:8px"><div><label for="l-xd">Fecha</label><input id="l-xd" type="date"></div><div><label for="l-xn">Motivo</label><input id="l-xn" placeholder="Ej.: Fundación de Guayaquil"></div></div>'+
  '<div class="row" style="margin-top:8px"><button class="btn sec" id="l-xadd" type="button">Agregar en este dispositivo</button><button class="btn sec" id="l-xsave" type="button" data-needs="art">Guardar en la app</button></div><div class="msg" id="l-xmsg"></div><div id="l-xlist"></div>'+
  '<details><summary>Ver feriados nacionales cargados</summary><div class="scroll"><table><tbody>'+aniosCub().map(function(y){return DATA.feriados[y].map(function(f){return '<tr><td>'+largo(parseD(f[0]))+'</td><td style="text-align:left">'+esc(f[1])+'</td></tr>'}).join('')}).join('')+'</tbody></table></div><p class="hint">Fuente: calendario oficial de feriados 2026–2030 del Viceministerio de Turismo, con traslados aplicados. 2 de enero de 2026: descanso por Decreto Ejecutivo 249.</p></details></div>'+
 '<p class="nota">Las actuaciones marcadas "verificar" vienen de la norma pero no se contrastaron con el texto vigente en esta versión. Confirme el artículo antes de usar el resultado. Para materias especiales (niñez, laboral, constitucional) revise si la ley fija reglas propias.</p>';
 var st=store('pla')||{};
 var hoy=new Date();$('#l-fec').value=st.fec||iso(hoy);
 $('#l-pre').value=st.pre||'0-1';if(!$('#l-pre').value)$('#l-pre').value='0-1';
 L.tipo=st.tipo||'t';
 if(st.pre==='custom'&&st.n)$('#l-n').value=st.n;
 $('#l-pre').onchange=function(){var p=pre();if(p){$('#l-n').value=p[1];L.tipo=p[2]}calcPla()};
 if($('#l-pre').value!=='custom'){var p0=pre();$('#l-n').value=p0[1];L.tipo=p0[2]}
 $$('#l-tipo button').forEach(function(b){b.onclick=function(){L.tipo=b.dataset.k;calcPla()}});
 $('#l-fec').oninput=$('#l-n').oninput=calcPla;
 $('#l-xadd').onclick=function(){var d=$('#l-xd').value,n=$('#l-xn').value.trim()||'Día inhábil';if(!d)return;var x=store('extra')||[];x.push([d,n]);store('extra',x);listExtra();calcPla()};

var L={tipo:'t'};
function pre(){var v=$('#l-pre').value;if(v==='custom')return null;var a=v.split('-');return PRE[+a[0]].items[+a[1]]}
function listExtra(){var all=(DATA.inhabilesExtra||[]).map(function(f){return f.concat('app')}).concat((store('extra')||[]).map(function(f){return f.concat('local')}));$('#l-xlist').innerHTML=all.length?'<table style="margin-top:8px"><tbody>'+all.map(function(f){return '<tr><td>'+largo(parseD(f[0]))+'</td><td style="text-align:left">'+esc(f[1])+(f[2]==='local'?' <span class="tag">solo este dispositivo</span>':'')+'</td></tr>'}).join('')+'</tbody></table>':''}
function calcPla(){
 var p=pre(),custom=!p;
 $('#l-wt').hidden=!custom;
 $$('#l-tipo button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===L.tipo)});
 var n=Math.max(1,Math.round(num($('#l-n').value))),fs=$('#l-fec').value,tipo=custom?L.tipo:p[2];
 $('#l-n').disabled=!custom;
 $('#l-base').innerHTML=p?'Base: '+(PRE[+$('#l-pre').value.split('-')[0]].c)+' '+p[3]+' · '+TIPO[p[2]]+' '+(p[4]?'<span class="tag v">verificado</span>':'<span class="tag">verificar</span>'):'Cómputo personalizado: '+TIPO[tipo]+'.';
 if(!fs){$('#l-res').innerHTML='<p>Indique la fecha.</p>';return}
 var desde=parseD(fs),F=feriadosSet(),r=computar(desde,n,tipo,F);
 var y=r.fin.getFullYear(),cub=aniosCub().indexOf(String(y))>-1&&aniosCub().indexOf(String(desde.getFullYear()))>-1;
 var hoy=new Date();hoy.setHours(0,0,0,0);
 var rest=0,d=new Date(hoy);if(r.fin>=hoy){while(d<r.fin){d.setDate(d.getDate()+1);if(tipo!=='t'||!inhabil(d,F))rest++}}
 var venc=r.fin<hoy;
 var ini=inhabil(desde,F);
 $('#l-res').className='res '+(venc?'mal':'ok');
 $('#l-res').innerHTML='<div class="estado">'+(venc?'Vencido':'Vence')+'</div><div class="big" style="font-size:22px">'+largo(r.fin)+'</div>'+
  '<div>'+n+' '+({t:'días hábiles',p:'días calendario',m:n===1?'mes':'meses',a:n===1?'año':'años'}[tipo])+' desde la notificación del '+largo(desde)+'.</div>'+
  (venc?'':'<div style="margin-top:4px"><b>'+(rest===0?'Vence hoy':'Quedan '+rest+' '+(tipo==='t'?'días hábiles':'días'))+'</b> contando desde hoy.</div>')+
  (ini?'<p class="hint">La notificación fue en día inhábil ('+esc(ini)+'): el cómputo empieza igual al día siguiente; confirme el criterio del juzgado.</p>':'')+
  (r.saltos.filter(function(s){return s[0]!=='mov'}).length?'<p class="hint">Feriados excluidos o saltados: '+r.saltos.filter(function(s){return s[0]!=='mov'}).map(function(s){return s[0].getDate()+' '+MESES[s[0].getMonth()].slice(0,3)+' ('+esc(s[1])+')'}).join(', ')+'.</p>':'')+
  (r.saltos.some(function(s){return s[0]==='mov'})?'<p class="hint">El plazo vencía en día inhábil y se trasladó al siguiente día hábil.</p>':'')+
  (cub?'':'<p class="hint" style="color:var(--mal)">El cómputo cae en un año sin feriados cargados: el resultado solo descuenta fines de semana.</p>');
 store('pla',{fec:fs,pre:$('#l-pre').value,tipo:L.tipo,n:n});
}

function renderTra(){
 var v=$('#v-tra');
 v.innerHTML='<h2>Notificación de boleta de tránsito</h2><p class="sub">Art. 179 LOTTTSV: la citación que no se entrega personalmente se remite al domicilio o al correo electrónico registrado del propietario en un plazo no mayor de 72 horas desde la infracción.</p>'+
 '<div class="card"><h3>Fechas</h3><div class="grid">'+
  '<div class="full"><label for="t-inf">Fecha y hora de la infracción</label><input id="t-inf" type="datetime-local"></div>'+
  '<div class="full"><label for="t-not">Fecha y hora en que llegó el correo de notificación</label><input id="t-not" type="datetime-local"></div>'+
 '</div><p class="hint">Use la hora de la boleta y la del correo recibido (guarde captura del correo con su fecha).</p></div>'+
 '<div class="res" id="t-res"></div>'+
 '<p class="nota">La impugnación se presenta dentro del término de 3 días desde la notificación (art. 644 COIP), contados en días hábiles. Aunque la notificación esté en término, puede impugnarse por el fondo (error en la placa, señalización, prueba de la detección electrónica). Para contravenciones detectadas por medios electrónicos rige también el art. 179.b LOTTTSV.</p>';
 var st=store('tra')||{};
 if(st.inf)$('#t-inf').value=st.inf;if(st.not)$('#t-not').value=st.not;
 $('#t-inf').oninput=$('#t-not').oninput=calcTra;calcTra();
}
function calcTra(){
 var a=$('#t-inf').value,b=$('#t-not').value,r=$('#t-res');
 store('tra',{inf:a,not:b});
 if(!a||!b){r.className='res';r.innerHTML='<p style="margin:0">Ingrese ambas fechas para ver el resultado.</p>';return}
 var A=new Date(a),B=new Date(b),h=(B-A)/36e5;
 if(h<0){r.className='res mal';r.innerHTML='<div class="estado">Revise las fechas</div><p style="margin:4px 0 0">La notificación no puede ser anterior a la infracción.</p>';return}
 var ok=h<=72,F=feriadosSet(),lim=computar(new Date(B.getFullYear(),B.getMonth(),B.getDate()),3,'t',F).fin;
 var dd=Math.floor(h/24),hh=Math.floor(h-dd*24),mm=Math.round((h-Math.floor(h))*60);if(mm===60){mm=0;hh++}
 var tope=new Date(A.getTime()+72*36e5);
 r.className='res '+(ok?'ok':'mal');
 r.innerHTML='<div class="estado">'+(ok?'En término':'Extemporáneo')+'</div><div class="big">'+(Math.round(h*10)/10).toLocaleString('es-EC')+' horas</div>'+
  '<div>'+dd+' día'+(dd===1?'':'s')+', '+hh+' h '+mm+' min entre la infracción y la notificación. Límite: '+largoH(tope)+'.</div>'+
  '<div class="accion">'+(ok?'Pagar multa':'Impugnar')+'</div>'+
  '<p style="margin:10px 0 0">'+(ok?'La notificación se hizo dentro de las 72 horas. Salvo que haya argumentos de fondo, corresponde pagar la multa.':'La notificación excedió las 72 horas del art. 179 LOTTTSV: hay base para impugnar por notificación tardía.')+'</p>'+
  '<p style="margin:6px 0 0"><b>Fecha límite para impugnar:</b> '+largo(lim)+' (3 días hábiles desde la notificación).</p>';
}
